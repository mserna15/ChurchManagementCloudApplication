<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${member.id} == null ? 'Add Member – CCMS' : 'Edit Member – CCMS'">Member Form – CCMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');

        :root {
            --navy:      #1c2b3a;
            --navy-mid:  #2a3f54;
            --gold:      #c8973a;
            --cream:     #faf7f2;
            --text:      #2c3340;
            --text-muted:#6b7585;
            --border:    #ddd8cf;
            --success-bg:#edf7ed;
            --success-fg:#2e6b30;
            --error-bg:  #fdecea;
            --error-fg:  #8b2020;
            --radius:    8px;
            --shadow:    0 2px 12px rgba(28,43,58,0.10);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; line-height: 1.6; }

        header { background: var(--navy); padding: 0 2.5rem; display: flex; align-items: center; justify-content: space-between; height: 64px; box-shadow: 0 2px 16px rgba(0,0,0,0.25); }

        .site-title { font-family: 'Cormorant Garamond', serif; font-size: 1.45rem; font-weight: 600; color: #fff; letter-spacing: 0.02em; }
        .site-title span { color: var(--gold); }

        nav { display: flex; gap: 0.25rem; }
        nav a { font-size: 0.875rem; font-weight: 500; color: rgba(255,255,255,0.72); text-decoration: none; padding: 0.45rem 1rem; border-radius: var(--radius); transition: background 0.18s, color 0.18s; }
        nav a:hover, nav a.active { background: rgba(255,255,255,0.10); color: #fff; }

        main { max-width: 1060px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

        .page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.75rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; color: var(--navy); }

        .btn { display: inline-flex; align-items: center; padding: 0.5rem 1.2rem; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; text-decoration: none; cursor: pointer; border: none; transition: background 0.18s, box-shadow 0.18s; }
        .btn-primary { background: var(--navy); color: #fff; }
        .btn-primary:hover { background: var(--navy-mid); box-shadow: var(--shadow); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { border-color: var(--navy); color: var(--navy); }

        .alert { padding: 0.85rem 1.1rem; border-radius: var(--radius); font-size: 0.9rem; margin-bottom: 1.25rem; border-left: 4px solid; }
        .alert-success { background: var(--success-bg); color: var(--success-fg); border-color: var(--success-fg); }
        .alert-error   { background: var(--error-bg);   color: var(--error-fg);   border-color: var(--error-fg); }

        .form-card { background: #fff; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); padding: 2rem 2.25rem; max-width: 600px; }

        .form-group { margin-bottom: 1.35rem; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem; }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%; padding: 0.6rem 0.85rem; border: 1.5px solid var(--border); border-radius: var(--radius);
            font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: var(--text); background: var(--cream);
            transition: border-color 0.18s, box-shadow 0.18s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(42,63,84,0.10); background: #fff; }
        .form-group textarea { min-height: 110px; resize: vertical; }

        .field-error { display: block; font-size: 0.8rem; color: var(--error-fg); margin-top: 0.3rem; }

        .form-actions { display: flex; gap: 0.75rem; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<header>
    <span class="site-title">Church <span>&amp;</span> Community</span>
    <nav>
        <a href="/groups">Ministry Groups</a>
        <a href="/members" class="active">Members</a>
    </nav>
</header>

<main>
    <div class="page-header">
        <h1 th:text="${member.id} == null ? 'Add Member' : 'Edit Member'">Member Form</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="form-card">
        <form th:action="${member.id} == null ? @{/members/add} : @{/members/edit/{id}(id=${member.id})}"
              th:object="${member}"
              method="post">

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}" placeholder="First name" />
                <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}" placeholder="Last name" />
                <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" th:field="*{email}" placeholder="email@example.com" />
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="e.g. 602-555-0101" />
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label for="joinDate">Join Date</label>
                <input type="date" id="joinDate" th:field="*{joinDate}" />
            </div>

            <div class="form-group">
                <label for="ministryGroupId">Ministry Group</label>
                <select id="ministryGroupId" name="ministryGroupId">
                    <option value="">— Unassigned —</option>
                    <option th:each="group : ${groups}"
                            th:value="${group.id}"
                            th:text="${group.groupName}"
                            th:selected="${member.ministryGroup != null and member.ministryGroup.id == group.id}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit"
                        th:text="${member.id} == null ? 'Add Member' : 'Update Member'">Submit</button>
                <a class="btn btn-outline" href="/members">Cancel</a>
            </div>

        </form>
    </div>
</main>

</body>
</html>
